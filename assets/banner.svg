<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }

      .floating-card { animation: float 6s ease-in-out infinite; }
      .pulsing-glow { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="350" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Glowing Circles -->
  <circle cx="950" cy="100" r="180" fill="#38bdf8" opacity="0.15" filter="blur(40px)" class="pulsing-glow"/>
  <circle cx="1050" cy="250" r="140" fill="#c084fc" opacity="0.15" filter="blur(40px)" class="pulsing-glow" style="animation-delay: 2s;"/>

  <!-- Dynamic Tech Illustration Elements (Right Side) -->
  <g transform="translate(780, 50)" class="floating-card">
    <rect x="0" y="20" width="340" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.9"/>
    <rect x="20" y="40" width="120" height="12" rx="4" fill="#38bdf8"/>
    <rect x="20" y="65" width="80" height="8" rx="4" fill="#64748b"/>
    
    <rect x="20" y="90" width="290" height="35" rx="6" fill="#334155"/>
    <circle cx="40" cy="107" r="6" fill="#4ade80"/>
    <rect x="55" y="102" width="100" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="240" y="97" width="60" height="20" rx="10" fill="#0284c7"/>

    <rect x="20" y="135" width="290" height="35" rx="6" fill="#334155"/>
    <circle cx="40" cy="152" r="6" fill="#facc15"/>
    <rect x="55" y="147" width="130" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="240" y="142" width="60" height="20" rx="10" fill="#eab308"/>

    <rect x="20" y="180" width="290" height="35" rx="6" fill="#334155"/>
    <circle cx="40" cy="197" r="6" fill="#38bdf8"/>
    <rect x="55" y="192" width="90" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="240" y="187" width="60" height="20" rx="10" fill="#6366f1"/>
  </g>

  <!-- Foreground Content (Left Side) -->
  <g transform="translate(60, 0)">
    <rect x="0" y="55" width="270" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="16" y="76" class="tag">⚡ CURATED FSM ECOSYSTEM</text>

    <text x="0" y="140" class="title">Awesome Field Service</text>
    <text x="0" y="192" class="title" fill="url(#accent-grad)">Management (FSM)</text>

    <text x="0" y="240" class="subtitle">SaaS Platforms &amp; Open-Source Software for Work Orders,</text>
    <text x="0" y="268" class="subtitle">Dispatching, Technician Scheduling &amp; Asset Maintenance</text>
  </g>
</svg>
